<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ログイン | くじ引き</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card">
            <h1>ログイン</h1>
            <p class="auth-description">ログインして、あなたのくじ引きを管理しましょう。</p>

            <a href="/auth/login" class="btn primary auth-action">ログイン</a>

            <div class="auth-divider"><span>または</span></div>
            <p class="auth-switch-copy">アカウントをお持ちでない方</p>
            <a href="/auth/signup" class="btn auth-action">アカウントを作成</a>
            <a href="/" class="auth-back-link">トップページに戻る</a>
        </section>
    </main>

</body>

</html>
