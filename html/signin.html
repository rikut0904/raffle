<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新規登録 | くじ引き</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="admin-body">
    <div class="admin-layout" style="justify-content: center; align-items: center;">
        <main class="content-body" style="padding: 20px;">
            <div id="admin-status" class="admin-notice">Common IDでアカウントを作成してください。</div>

            <section class="admin-card auth-card">
                <div class="auth-card-header">
                    <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 8px;">Create Account</h1>
                    <p style="color: var(--text-muted); font-size: 0.95rem;">アカウント作成</p>
                </div>
                <a href="/auth/signup" class="btn primary" style="width: 100%; margin-top: 12px;">Common IDでアカウント作成</a>

                <div class="auth-card-footer">
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;">既にアカウントをお持ちの場合</p>
                    <a href="/login" class="btn" style="width: 100%;">ログイン画面へ</a>
                </div>
            </section>

            <div style="text-align: center; margin-top: 24px;">
                <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500;">← トップページに戻る</a>
            </div>
        </main>
    </div>

</body>

</html>
